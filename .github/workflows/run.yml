name: run
on:
  workflow_dispatch:
    inputs:
      th:
        description: sha256 of the control token
        required: true
      minutes:
        description: how long to keep the phone alive
        default: "150"
      img:
        description: system image
        default: "system-images;android-34;google_apis_playstore;x86_64"
      nowa:
        description: skip WhatsApp
        default: ""
permissions:
  contents: write
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: phone
        env:
          TH: ${{ inputs.th }}
          MINUTES: ${{ inputs.minutes }}
          IMG: ${{ inputs.img }}
          NOWA: ${{ inputs.nowa }}
        run: bash runner.sh
